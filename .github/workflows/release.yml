name: Build and Release

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].*'   # CalVer: vYYYY.MM.##

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve version from tag
        id: get_version
        shell: pwsh
        run: |
          # Source of truth: the pushed tag (e.g. v2026.03.1 → 2026.03.1)
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Tag: $tag  Version: $version"

      - name: Validate tag matches pyproject.toml
        shell: pwsh
        run: |
          $tagVersion = "${{ steps.get_version.outputs.VERSION }}"
          $content = Get-Content pyproject.toml
          $tomlVersion = ($content | Select-String -Pattern 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tagVersion -ne $tomlVersion) {
            Write-Error "Tag version '$tagVersion' does not match pyproject.toml version '$tomlVersion'. Update pyproject.toml before tagging."
            exit 1
          }
          Write-Host "✓ Tag matches pyproject.toml: $tagVersion"

      - name: Build executable with PyInstaller
        shell: pwsh
        run: |
          .\build.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          if (Test-Path "dist\EdgeHistoryFinder.exe") {
            Write-Host "✓ EdgeHistoryFinder.exe built successfully"
            $size = (Get-Item "dist\EdgeHistoryFinder.exe").Length / 1MB
            Write-Host "Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "Build failed - executable not found"
            exit 1
          }

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag     = "${{ steps.get_version.outputs.TAG }}"
          $version = "${{ steps.get_version.outputs.VERSION }}"

          $notes = @"
          ## Edge History Finder $tag

          ### What's New
          See [CHANGELOG](https://github.com/tradmangh/edge-history-finder/commits/$tag) for details.

          ### Features
          - **History Search**: Find lost URLs by time window with exclusion filters
          - **Closed Tabs Finder**: Recover tab groups via URL clustering
          - Right-click any result URL to copy it directly

          ### Download
          - Windows: `EdgeHistoryFinder.exe` (standalone, no installation required)

          ### Privacy & Security
          - Runs 100% locally — no network calls
          - Read-only access to Edge history
          - No telemetry or tracking

          ---

          **System design**: Thomas Radman
          "@

          gh release create $tag `
            dist/EdgeHistoryFinder.exe `
            --title "Edge History Finder $tag" `
            --notes $notes

          Write-Host "✓ Release $tag created successfully"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: EdgeHistoryFinder-${{ steps.get_version.outputs.TAG }}
          path: dist/EdgeHistoryFinder.exe
          retention-days: 90
