[project]
name = "edge-history-finder"
version = "0.1.0"
description = "Local UI tool to search Microsoft Edge history by date/time window, profiles, and negative filters; typed URLs only."
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
edge-history-finder = "edge_history_finder.__main__:main"
