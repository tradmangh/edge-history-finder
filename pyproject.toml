[project]
name = "edge-history-finder"
version = "2026.03.1"
description = "Search Edge history by time window with exclusion filters, and recover closed tab groups via URL clustering."
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
edge-history-finder = "edge_history_finder.__main__:main"
